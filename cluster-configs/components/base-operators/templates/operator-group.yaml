{{- range .Values.operators }}
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: {{ .operatorGroup.name }}
  namespace: {{ .namespace }}
spec:
  upgradeStrategy: {{ .operatorGroup.upgradeStrategy }}
{{- if $value.operatorGroup.targetNamespaces }}
  targetNamespaces:
  - {{ .namespace }}
{{- end }
{{- end }}

