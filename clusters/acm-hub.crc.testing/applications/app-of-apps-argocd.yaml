apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openshift-gitops
  namespace: argocd
spec:
  destination:
    server: 'https://kubernetes.default.svc'
  project: default
  source:
    path: clusters/acm-hub.crc.testing
    repoURL: >-
      https://github.com/adhambbaker/k8-gitops.git
    targetRevision: develop
  syncPolicy: {}
