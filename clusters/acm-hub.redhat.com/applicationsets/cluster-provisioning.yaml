apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cluster-provisioning
  namespace: argocd
spec:
  generators:
    - git:
        https://github.com/adhambbaker/k8-gitops.git
        revision: abb-dev
        files:
          - path: "clusters/**/provision.yaml"
  template:
    metadata:
      name: "provision-{{cluster.environment}}-{{cluster.name}}"
      labels:
        environment: "{{cluster.environment}}"
        cluster: "{{cluster.fqdn}}"
        region: "{{cluster.region}}"
        cloud: "{{cluster.cloud}}"
    spec:
      project: default
      source:
        https://github.com/adhambbaker/k8-gitops.git
        targetRevision: abb-dev
        path: base/provision/openshift-provisioning
        helm:
          valueFiles:
            - /conf/{{cluster.environment}}/provision.yaml
            - /clusters/{{cluster.environment}}/{{cluster.fqdn}}/provision.yaml
      destination:
        server: 'https://kubernetes.default.svc'
        namespace: 
      syncPolicy:
        syncOptions:
          - preserveResourcesOnDeletion=true
